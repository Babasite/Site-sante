{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page en préparation</title>

<style>
body{
    margin:0;
    background:#efe3c3;
    font-family:Arial,Helvetica,sans-serif;
}

.message{
    margin-top:30px;
    text-align:center;
    color:#322e7d;
    font-family:Georgia,"Times New Roman",serif;
    font-size:1.35rem;
    font-weight:bold;
}

.image{
    width:300px;
    height:300px;
    margin:25px auto 0;
    border-radius:18px;
    background-image:url("{% static 'accueil/images/moiManga.png' %}"); 
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    box-shadow:0 12px 28px rgba(0,0,0,.18);
}

.retour{
    margin-top:35px;
    text-align:center;
}

.retour img{
    width:120px;
    height:auto;
    transition:transform .25s;
}

.retour img:hover{
    transform:scale(1.08);
}

.retour p{
    margin-top:8px;
    color:#555;
    font-size:1rem;
    font-style:italic;
}
</style>

</head>

<body>

<div class="message">
    Désolé, cette page n'est pas encore prête à être livrée... 🙂
</div>

<div class="image"></div>

<div class="retour">

    <a href="{% url 'sedebrouiller' %}"> /* changer ici pr retourner page précédente*/
        <img src="{% static 'accueil/images/logo.png' %}"
             alt="Retour">
    </a>

    <p>Retour à la page précédente en attendant.</p>

</div>

</body>
</html>

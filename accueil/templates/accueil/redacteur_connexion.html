<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion rédacteur</title>
<style>
body{font-family:Arial,sans-serif;background:#efe3c3;margin:0;padding:40px;color:#2f382f;}
.carte{max-width:460px;margin:70px auto;padding:28px;background:#fff;border-radius:10px;box-shadow:0 0 10px #ccc;}
h1{margin-top:0;color:#00695c;}
label{display:block;margin:16px 0 6px;font-weight:bold;}
input{width:100%;padding:11px;border:1px solid #bbb;border-radius:6px;box-sizing:border-box;}
button{margin-top:22px;padding:12px 18px;border:0;border-radius:8px;background:#00695c;color:#fff;font-size:17px;cursor:pointer;}
a{color:#00695c;}.erreur{padding:10px;border-radius:6px;background:#f8d7da;color:#842029;}
</style>
</head>
<body>
<div class="carte">
<h1>Connexion rédacteur</h1>
{% for message in messages %}<p class="erreur">{{ message }}</p>{% endfor %}
<form method="post">
{% csrf_token %}
<label for="username">Identifiant</label>
<input id="username" name="username" autocomplete="username" required autofocus>
<label for="password">Mot de passe</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Se connecter</button>
</form>
<p><a href="{% url 'veille' %}">Retour à la veille</a></p>
</div>
</body>
</html>
